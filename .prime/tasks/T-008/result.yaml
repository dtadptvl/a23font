note: "Live M6.A1 captured end-to-end on the real A23 in one bounded run (~15.4 min wall, well under the 30 min cap): 11-style collection truncated to 4 via the new documented A23FONT_MAX_STYLES knob (audit event 'styles truncated'), 2 cached styles served byte-identical in 504/343 ms proving cache reuse inside a live collection run, 2 fresh styles reconstructed with heavy-validated binaries, PACKAGING stage produced the mandate-conformant zip which was downloaded through the public tunnel and verified entry-by-entry. Deviations, all honest and documented: (1) no style failed naturally live, so DONE_WITH_ERRORS isolation (M6.A2) rests on the offline forced-failure flow tests running the same worker run_styles loop; the diagnostic hook A23FONT_FORCE_FAIL_STYLES is documented in .env.example as ops/testing only and was left empty on the phone. (2) Synthetic 3-glyph test fonts are ~1.4 KB, below the mandated 20 KB hollow guard; the flow tests therefore lower pipeline.pack.MIN_FONT_BYTES via monkeypatch while tests/test_pack.py proves the guard at the full 20000 threshold - production uses the default. (3) Zip font names follow the literal <Family>-<Style> mandate so the family appears twice when style names include it (Postamp-Grotesk-Postamp-Grotesk-Light.ttf); safe_component keeps them ASCII <=80 chars and dedupes collisions. Pending milestone gaps unchanged: Vietnamese raises VIETNAMESE_PENDING (classified per-style now), glyph metrics heuristic, kerning/features skipped. Rollback: redeploy a23font:v2 or v1 (both kept) and/or unset A23FONT_MAX_STYLES. Commits pushed: ccb8cff (code, 173 green) and 188b4a6 (live record in docs/DEPLOY_A23.md). Regression after the run: tunnel status.sh healthy (PID 6838, 4 ready connections), monitor 2080 -> 200, ddns Up 10h, MemAvailable ~2.06 GB, dmesg no OOM."